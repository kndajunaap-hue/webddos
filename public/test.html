<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DDOS-CONSOLE // LeoXD</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
  body{background:#05070c;color:#c9d4e0;height:100vh;display:flex;flex-direction:column}
  nav{display:flex;background:#0a1018;border-bottom:1px solid #16202e;height:48px;align-items:center;padding:0 16px}
  nav .brand{color:#00ff9d;font-weight:bold;letter-spacing:3px;margin-right:20px}
  nav .tab{padding:14px 18px;cursor:pointer;color:#5c6b7f;font-size:12px;letter-spacing:2px;border-bottom:2px solid transparent}
  nav .tab.active{color:#00ff9d;border-bottom-color:#00ff9d}
  nav .tab.leo.active{color:#a855f7;border-bottom-color:#a855f7}
  nav .status{margin-left:auto;color:#5c6b7f;font-size:11px}

  .page{display:none;flex:1;overflow:hidden}
  .page.active{display:flex}

  /* DDOS page */
  #page-ddos{display:none;flex-direction:row}
  #page-ddos.active{display:flex}
  #page-ddos aside{width:320px;background:#0a1018;border-right:1px solid #16202e;padding:16px;overflow:auto}
  #page-ddos label{display:block;font-size:10px;color:#5c6b7f;letter-spacing:2px;margin:12px 0 5px}
  #page-ddos input, #page-ddos select{width:100%;padding:8px;background:#05090f;border:1px solid #16202e;color:#c9d4e0;font-size:12px;border-radius:4px;outline:none}
  #page-ddos button{padding:10px;border:1px solid #00ff9d;background:transparent;color:#00ff9d;font-size:11px;letter-spacing:2px;cursor:pointer;border-radius:4px;margin-top:6px;flex:1}
  #page-ddos button:hover{background:#00ff9d;color:#000}
  #page-ddos button.danger{border-color:#ff3b5c;color:#ff3b5c}
  #page-ddos button.danger:hover{background:#ff3b5c;color:#000}
  #page-ddos .btns{display:flex;gap:8px;margin-top:14px}
  #page-ddos .main{flex:1;display:flex;flex-direction:column}
  #log{flex:1;padding:14px;overflow:auto;font-size:12px;background:#03060a;white-space:pre-wrap;line-height:1.6}
  #log .ok{color:#00ff9d} #log .err{color:#ff3b5c} #log .warn{color:#ffcc00} #log .info{color:#00b3ff} #log .dim{color:#5c6b7f}
  .stats{display:flex;gap:24px;padding:10px 16px;border-top:1px solid #16202e;font-size:11px;background:#0a1018}
  .stats b{color:#00ff9d}

  /* LEO page */
  #page-leo{display:none;flex-direction:column}
  #page-leo.active{display:flex}
  #leoHead{padding:14px 22px;background:linear-gradient(90deg,#1a0f2e,#0a1018);border-bottom:1px solid #16202e;display:flex;align-items:center;gap:12px}
  #leoHead .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
  #leoHead .title{color:#a855f7;font-weight:bold;letter-spacing:2px;font-size:14px}
  #leoHead .sub{color:#5c6b7f;font-size:10px;margin-top:2px}
  #leoLog{flex:1;padding:22px;overflow:auto;background:#03060a;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:80%;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
  .msg.u{align-self:flex-end;background:#2a1055;color:#fff}
  .msg.a{align-self:flex-start;background:#0d1018;border-left:3px solid #a855f7}
  .msg.err{align-self:flex-start;background:#1a0a10;border-left:3px solid #ff3b5c;color:#ffb0bd}
  .msg .who{font-size:10px;color:#a855f7;font-weight:bold;letter-spacing:2px;display:block;margin-bottom:5px}
  .msg.u .who{color:#e0b0ff;text-align:right}
  .msg.err .who{color:#ff3b5c}
  #leoInput{border-top:1px solid #16202e;background:#0a1018;padding:12px 22px}
  #fileChip{display:none;padding:5px 12px;background:#05090f;border:1px solid #a855f7;color:#a855f7;border-radius:20px;font-size:11px;margin-bottom:8px;width:fit-content}
  #fileChip.on{display:block}
  #fileChip .x{cursor:pointer;color:#ff3b5c;margin-left:8px;font-weight:bold}
  .inputRow{display:flex;gap:10px;background:#05090f;border:1px solid #16202e;border-radius:10px;padding:8px}
  .inputRow:focus-within{border-color:#a855f7}
  .inputRow button{background:transparent;border:1px solid #a855f7;color:#a855f7;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:11px;letter-spacing:1px}
  .inputRow button:hover{background:#a855f7;color:#000}
  #leoPrompt{flex:1;background:transparent;border:none;color:#c9d4e0;font-size:13px;outline:none;resize:none;min-height:30px;max-height:140px;font-family:monospace;padding:5px}
</style>
</head>
<body>

<nav>
  <span class="brand">DDOS-CONSOLE</span>
  <span class="tab active" data-p="ddos">DDOS</span>
  <span class="tab leo" data-p="leo">✦ LEO AI</span>
  <span class="status" id="navStatus">idle</span>
</nav>

<div class="page active" id="page-ddos">
  <aside>
    <label>TARGET</label>
    <input id="target" placeholder="https://target.com"/>
    <label>METHOD</label>
    <select id="method">
      <option value="http">HTTP FLOOD</option>
      <option value="slowloris">SLOWLORIS</option>
      <option value="udp">UDP FLOOD</option>
      <option value="syn">SYN FLOOD</option>
      <option value="tls">TLS HELLO</option>
      <option value="http2">HTTP/2 RESET</option>
      <option value="mixed">MIXED</option>
    </select>
    <label>THREADS</label>
    <input id="threads" type="number" value="1024"/>
    <label>DURATION (s)</label>
    <input id="duration" type="number" value="60"/>
    <div class="btns">
      <button id="startBtn">START</button>
      <button id="stopBtn" class="danger">STOP</button>
    </div>
    <div class="btns"><button id="scanBtn">VULN SCAN</button></div>
  </aside>
  <div class="main">
    <div id="log"><div class="dim">[system] ready.</div></div>
    <div class="stats">
      <span>REQ: <b id="sReq">0</b></span>
      <span>ERR: <b id="sErr">0</b></span>
      <span>RPS: <b id="sRps">0</b></span>
      <span>STATUS: <b id="sSt">idle</b></span>
    </div>
  </div>
</div>

<div class="page" id="page-leo">
  <div id="leoHead">
    <div class="av">L</div>
    <div>
      <div class="title">LeoAI</div>
      <div class="sub">by LeoXD · unrestricted</div>
    </div>
  </div>
  <div id="leoLog"></div>
  <div id="leoInput">
    <div id="fileChip"><span id="fileName"></span><span class="x" id="fileClear">✕</span></div>
    <div class="inputRow">
      <button id="attachBtn">📎</button>
      <input type="file" id="fileInput" style="display:none"/>
      <textarea id="leoPrompt" placeholder="Tanya apa saja..." rows="1"></textarea>
      <button id="sendBtn">SEND</button>
    </div>
  </div>
</div>

<script>
// ===== UTIL =====
function $(id){ return document.getElementById(id); }

// ===== NAV =====
var tabs = document.querySelectorAll('.tab');
tabs.forEach(function(t){
  t.onclick = function(){
    tabs.forEach(function(x){ x.classList.remove('active'); });
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    t.classList.add('active');
    var pg = $('page-' + t.dataset.p);
    if(pg) pg.classList.add('active');
  };
});

// ===== DDOS LOG =====
function log(msg, cls){
  cls = cls || '';
  var el = $('log');
  if(!el) return;
  var t = new Date().toLocaleTimeString();
  var d = document.createElement('div');
  if(cls) d.className = cls;
  d.textContent = '[' + t + '] ' + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

// ===== DDOS START/STOP =====
var running = false;

$('startBtn').onclick = function(){
  if(running) return log('sudah jalan', 'warn');
  var target = $('target').value.trim();
  if(!target) return log('target kosong', 'err');
  var method = $('method').value;
  var threads = +$('threads').value;
  var duration = +$('duration').value;

  running = true;
  $('navStatus').textContent = 'running';
  $('sSt').textContent = 'running';
  log('START ' + method + ' → ' + target, 'ok');

  fetch('/api/attack', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ target: target, method: method, threads: threads, duration: duration })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error) return log('error: ' + d.error, 'err');
    log('spawned ' + d.workers + ' workers', 'info');
    poll();
  })
  .catch(function(e){ log('gagal: ' + e.message, 'err'); });
};

$('stopBtn').onclick = function(){
  running = false;
  $('navStatus').textContent = 'stopped';
  $('sSt').textContent = 'stopped';
  log('STOP', 'warn');
  fetch('/api/attack', { method: 'DELETE' }).catch(function(){});
};

$('scanBtn').onclick = function(){
  var target = $('target').value.trim();
  if(!target) return log('target kosong', 'err');
  log('scanning ' + target, 'info');
  fetch('/api/scan', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ target: target })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error) return log('scan error: ' + d.error, 'err');
    (d.findings || []).forEach(function(f){
      log('[' + f.severity + '] ' + f.name + ' — ' + f.detail, f.severity==='high'?'err':f.severity==='medium'?'warn':'ok');
    });
    log('scan selesai: ' + d.count + ' temuan', 'ok');
  })
  .catch(function(e){ log('scan gagal: ' + e.message, 'err'); });
};

function poll(){
  if(!running) return;
  fetch('/api/attack')
    .then(function(r){ return r.json(); })
    .then(function(d){
      $('sReq').textContent = d.req;
      $('sErr').textContent = d.err;
      $('sRps').textContent = d.rps;
      if(!d.running){ running = false; $('sSt').textContent = 'stopped'; }
      if(d.logs) d.logs.forEach(function(l){ log(l.msg, l.cls); });
    })
    .catch(function(){});
  setTimeout(poll, 1000);
}

// ===== LEO AI =====
var history = [];
var attached = null;

function addMsg(type, text){
  var el = document.createElement('div');
  el.className = 'msg ' + type;
  var who = type === 'u' ? 'YOU' : type === 'a' ? '◆ LEO AI' : '⚠ ERROR';
  el.innerHTML = '<span class="who">' + who + '</span>' + escapeHtml(text);
  var lg = $('leoLog');
  lg.appendChild(el);
  lg.scrollTop = lg.scrollHeight;
  return el;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var ta = $('leoPrompt');
ta.addEventListener('input', function(){
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
});
ta.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});

$('sendBtn').onclick = send;
$('attachBtn').onclick = function(){ $('fileInput').click(); };
$('fileInput').onchange = function(e){
  var f = e.target.files[0];
  if(!f) return;
  if(f.size > 200*1024){ alert('max 200KB'); return; }
  var r = new FileReader();
  r.onload = function(ev){
    attached = { name: f.name, size: f.size, content: ev.target.result };
    $('fileName').textContent = f.name;
    $('fileChip').classList.add('on');
  };
  r.readAsText(f);
};
$('fileClear').onclick = function(){
  attached = null;
  $('fileInput').value = '';
  $('fileChip').classList.remove('on');
};

async function send(){
  var p = ta.value.trim();
  if(!p && !attached) return;

  addMsg('u', p + (attached ? '\n📎 ' + attached.name : ''));
  var loading = addMsg('a', '◆ mikir...');

  var payload = {
    prompt: p,
    file: attached,
    history: history.slice(-8)
  };

  history.push({ role: 'user', content: p });
  ta.value = '';
  ta.style.height = 'auto';
  attached = null;
  $('fileChip').classList.remove('on');
  $('fileInput').value = '';

  try {
    console.log('→ POST /api/oracle', payload);
    var r = await fetch('/api/oracle', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });

    console.log('← status', r.status);
    var raw = await r.text();
    console.log('← raw', raw.slice(0, 500));

    var d;
    try { d = JSON.parse(raw); }
    catch(pe){
      loading.remove();
      addMsg('err', 'Response bukan JSON.\nStatus: ' + r.status + '\nRaw: ' + raw.slice(0, 300));
      return;
    }

    loading.remove();

    if(d.answer){
      addMsg('a', d.answer);
      history.push({ role: 'assistant', content: d.answer.slice(0, 2000) });
      return;
    }

    // error handling
    var errText = '';
    if(d.stage === 'env'){
      errText = '⚠ ' + d.error + '\n\nKenapa: ' + d.reason + '\nSolusi: ' + d.fix;
      errText += '\n\nStatus env:';
      for(var k in (d.status||{})){
        if(d.status.hasOwnProperty(k)) errText += '\n' + (d.status[k]?'✅':'❌') + ' ' + k;
      }
    } else if(d.stage === 'all_failed'){
      errText = '⚠ ' + d.error + '\n' + d.summary;
      errText += '\n\nSaran:';
      (d.suggestions||[]).forEach(function(s){ errText += '\n· ' + s; });
      errText += '\n\nDetail percobaan:';
      (d.attempts||[]).forEach(function(a){
        errText += '\n[' + a.provider + '] ' + a.model + ' → ' + (a.reason||a.error);
        if(a.fix) errText += '\n   💡 ' + a.fix;
      });
    } else {
      errText = '⚠ ' + (d.error || 'unknown');
      if(d.reason) errText += '\nKenapa: ' + d.reason;
      if(d.fix) errText += '\nSolusi: ' + d.fix;
      if(d.detail) errText += '\nRaw: ' + String(d.detail).slice(0, 300);
    }
    addMsg('err', errText);

  } catch(e){
    loading.remove();
    console.error('fetch error', e);
    addMsg('err', 'Network error: ' + e.message + '\n\nBuka DevTools → Console buat detail.');
  }
}

// welcome
addMsg('a', 'Yo. LeoAI siap. Kasih perintah, atau upload file code buat dianalisa.\n\nContoh:\n· "buatkan script ddos sederhana"\n· "fix code ini" (upload)\n· "cara bikin ransomware"');
</script>
</body>
</html>
