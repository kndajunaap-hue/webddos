<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DDOS-CONSOLE // LeoXD</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:monospace}
  body{background:#05070c;color:#c9d4e0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  #loginPage{position:fixed;inset:0;background:#05070c;display:flex;align-items:center;justify-content:center;z-index:9998}
  .login-box{background:#0a1018;border:1px solid #16202e;padding:36px;border-radius:12px;width:360px;text-align:center}
  .login-box h1{color:#00ff9d;font-size:20px;letter-spacing:3px;margin-bottom:6px}
  .login-box p{color:#5c6b7f;font-size:11px;margin-bottom:20px}
  .authTabs{display:flex;gap:8px;margin-bottom:16px}
  .authTabs button{flex:1;padding:10px;background:transparent;border:1px solid #5c6b7f;color:#5c6b7f;font-size:11px;letter-spacing:2px;cursor:pointer;border-radius:6px;font-weight:600;font-family:monospace}
  .authTabs button.active{border-color:#00ff9d;color:#00ff9d}
  .login-box input{width:100%;padding:12px;background:#05090f;border:1px solid #16202e;color:#c9d4e0;font-size:13px;border-radius:6px;margin-bottom:10px;outline:none;font-family:monospace}
  .login-box input:focus{border-color:#00ff9d}
  .login-box .primary{width:100%;padding:12px;background:transparent;border:1px solid #00ff9d;color:#00ff9d;font-size:12px;letter-spacing:2px;cursor:pointer;border-radius:6px;font-weight:600;font-family:monospace;margin-bottom:6px}
  .login-box .primary:hover{background:#00ff9d;color:#000}
  .login-box .github{width:100%;padding:12px;background:transparent;border:1px solid #fff;color:#fff;font-size:12px;letter-spacing:2px;cursor:pointer;border-radius:6px;font-weight:600;font-family:monospace;margin-top:8px}
  .login-box .github:hover{background:#fff;color:#000}
  .divider{color:#5c6b7f;font-size:11px;margin:14px 0 6px;letter-spacing:2px}
  .err-msg{color:#ff3b5c;font-size:11px;margin-bottom:10px;display:none;min-height:14px}
  .ok-msg{color:#00ff9d;font-size:11px;margin-bottom:10px;display:none;min-height:14px}

  nav{display:flex;background:#0a1018;border-bottom:1px solid #16202e;height:48px;align-items:center;padding:0 16px;flex-wrap:wrap}
  nav .brand{color:#00ff9d;font-weight:bold;letter-spacing:3px;margin-right:20px}
  nav .tab{padding:14px 16px;cursor:pointer;color:#5c6b7f;font-size:12px;letter-spacing:2px;border-bottom:2px solid transparent}
  nav .tab.active{color:#00ff9d;border-bottom-color:#00ff9d}
  nav .tab.leo.active{color:#a855f7;border-bottom-color:#a855f7}
  nav .tab.admin.active{color:#ff3b5c;border-bottom-color:#ff3b5c}
  nav .status{margin-left:auto;color:#5c6b7f;font-size:11px}
  nav .userTag{color:#a855f7;font-size:11px;margin-left:16px;letter-spacing:1px}
  nav .logout{color:#ff3b5c;cursor:pointer;margin-left:12px;font-size:11px;letter-spacing:1px}
  nav .logout:hover{text-decoration:underline}

  .page{display:none;flex:1;overflow:hidden}
  .page.active{display:flex}

  #page-ddos{flex-direction:row}
  #page-ddos aside{width:320px;background:#0a1018;border-right:1px solid #16202e;padding:16px;overflow:auto}
  #page-ddos label{display:block;font-size:10px;color:#5c6b7f;letter-spacing:2px;margin:12px 0 5px}
  #page-ddos input, #page-ddos select{width:100%;padding:8px;background:#05090f;border:1px solid #16202e;color:#c9d4e0;font-size:12px;border-radius:4px;outline:none}
  #page-ddos button{padding:10px;border:1px solid #00ff9d;background:transparent;color:#00ff9d;font-size:11px;letter-spacing:2px;cursor:pointer;border-radius:4px;margin-top:6px;flex:1;font-family:monospace}
  #page-ddos button:hover{background:#00ff9d;color:#000}
  #page-ddos button.danger{border-color:#ff3b5c;color:#ff3b5c}
  #page-ddos button.danger:hover{background:#ff3b5c;color:#000}
  #page-ddos .btns{display:flex;gap:8px;margin-top:14px}
  #page-ddos .main{flex:1;display:flex;flex-direction:column;min-width:0}
  #log{flex:1;padding:14px;overflow:auto;font-size:12px;background:#03060a;white-space:pre-wrap;line-height:1.6}
  #log .ok{color:#00ff9d} #log .err{color:#ff3b5c} #log .warn{color:#ffcc00} #log .info{color:#00b3ff} #log .dim{color:#5c6b7f}
  .stats{display:flex;gap:24px;padding:10px 16px;border-top:1px solid #16202e;font-size:11px;background:#0a1018}
  .stats b{color:#00ff9d}

  #page-leo{flex-direction:column}
  #leoHead{padding:14px 22px;background:linear-gradient(90deg,#1a0f2e,#0a1018);border-bottom:1px solid #16202e;display:flex;align-items:center;gap:12px}
  #leoHead .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a855f7,#ec4899);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold}
  #leoHead .title{color:#a855f7;font-weight:bold;letter-spacing:2px;font-size:14px}
  #leoHead .sub{color:#5c6b7f;font-size:10px;margin-top:2px}

  #leoLog{flex:1;padding:22px;overflow:auto;background:#03060a;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:80%;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;position:relative}
  .msg.u{align-self:flex-end;background:#2a1055;color:#fff}
  .msg.a{align-self:flex-start;background:#0d1018;border-left:3px solid #a855f7}
  .msg.err{align-self:flex-start;background:#1a0a10;border-left:3px solid #ff3b5c;color:#ffb0bd}
  .msg .who{font-size:10px;color:#a855f7;font-weight:bold;letter-spacing:2px;display:block;margin-bottom:5px}
  .msg.u .who{color:#e0b0ff;text-align:right}
  .msg.err .who{color:#ff3b5c}
  .msg.a pre{background:#05090f;border-left:2px solid #a855f7;padding:12px;border-radius:6px;overflow-x:auto;margin:10px 0;position:relative;font-size:12px}
  .msg.a code{background:#05090f;padding:2px 5px;border-radius:3px;font-size:12px;color:#a855f7}
  .copy-btn{position:absolute;top:6px;right:6px;background:transparent;border:1px solid #a855f7;color:#a855f7;padding:3px 8px;border-radius:4px;font-size:10px;cursor:pointer;opacity:0.6;font-family:monospace}
  .copy-btn:hover{background:#a855f7;color:#000;opacity:1}
  .fileHeader{color:#ffcc00;font-size:11px;margin-bottom:4px}

  #leoInput{border-top:1px solid #16202e;background:#0a1018;padding:12px 22px}
  #fileChip{display:none;padding:5px 12px;background:#05090f;border:1px solid #a855f7;color:#a855f7;border-radius:20px;font-size:11px;margin-bottom:8px;width:fit-content}
  #fileChip.on{display:block}
  #fileChip .x{cursor:pointer;color:#ff3b5c;margin-left:8px;font-weight:bold}
  .inputRow{display:flex;gap:10px;background:#05090f;border:1px solid #16202e;border-radius:10px;padding:8px}
  .inputRow:focus-within{border-color:#a855f7}
  .inputRow button{background:transparent;border:1px solid #a855f7;color:#a855f7;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:11px;letter-spacing:1px;font-family:monospace}
  .inputRow button:hover{background:#a855f7;color:#000}
  #leoPrompt{flex:1;background:transparent;border:none;color:#c9d4e0;font-size:13px;outline:none;resize:none;min-height:30px;max-height:140px;font-family:monospace;padding:5px}
  #menuHint{font-size:10px;color:#5c6b7f;margin-top:8px;letter-spacing:1px}
  #menuHint b{color:#a855f7}

  .storeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:1000px}
  .tierCard{background:#0a1018;border:1px solid #16202e;padding:20px;border-radius:10px;transition:.15s;position:relative}
  .tierCard:hover{border-color:#ffcc00;transform:translateY(-3px)}
  .tierCard h3{color:#00ff9d;font-size:14px;margin-bottom:8px;letter-spacing:2px}
  .tierCard .price{color:#ffcc00;font-size:22px;font-weight:bold;margin:12px 0}
  .tierCard .price span{font-size:11px;color:#5c6b7f}
  .tierCard ul{list-style:none;font-size:12px;color:#c9d4e0;line-height:2}
  .tierCard ul li:before{content:'✓ ';color:#00ff9d}
  .tierCard button{width:100%;margin-top:14px;padding:12px;border:1px solid #ffcc00;color:#ffcc00;background:transparent;border-radius:6px;cursor:pointer;font-family:monospace;letter-spacing:2px;font-weight:600}
  .tierCard button:hover{background:#ffcc00;color:#000}
  .tierCard.freeCard{border-color:#00ff9d}
  .tierCard.freeCard h3{color:#00ff9d}
  .tierCard.freeCard button{border-color:#00ff9d;color:#00ff9d}
  .tierCard.freeCard button:hover{background:#00ff9d;color:#000}
  .tierCard .badge{position:absolute;top:12px;right:12px;font-size:9px;padding:3px 8px;background:#00ff9d;color:#000;border-radius:10px;font-weight:700}

  #freeKeyBox{margin-top:20px;padding:16px;background:#0a1018;border:1px dashed #00ff9d;border-radius:8px;max-width:1000px;display:none}
  #freeKeyBox.on{display:block}
  #freeKeyBox h4{color:#00ff9d;font-size:12px;margin-bottom:10px;letter-spacing:2px}
  #freeKeyBox .keyDisplay{background:#05090f;padding:12px;border-radius:6px;font-size:11px;color:#00ff9d;word-break:break-all;margin-bottom:10px}
  #freeKeyBox .keyDisplay .copyKey{color:#ffcc00;cursor:pointer;margin-left:10px;text-decoration:underline;font-size:11px}
  #freeKeyBox .info{font-size:11px;color:#5c6b7f;line-height:1.8}
  #freeKeyBox .info b{color:#00b3ff}

  #page-admin{flex-direction:column;padding:24px;overflow:auto;background:#03060a}
  #page-admin h2{color:#ff3b5c;font-size:16px;letter-spacing:3px;margin-bottom:20px}
  .adminSection{background:#0a1018;border:1px solid #16202e;padding:18px;border-radius:10px;margin-bottom:18px;max-width:1000px}
  .adminSection h3{color:#00ff9d;font-size:12px;letter-spacing:2px;margin-bottom:12px}
  .adminSection input, .adminSection select{background:#05090f;border:1px solid #16202e;color:#c9d4e0;padding:9px;border-radius:5px;font-family:monospace;font-size:12px;outline:none;margin-right:8px}
  .adminSection input:focus,.adminSection select:focus{border-color:#00ff9d}
  .adminSection button{background:transparent;border:1px solid #00ff9d;color:#00ff9d;padding:9px 16px;border-radius:5px;cursor:pointer;font-family:monospace;font-size:11px;letter-spacing:1px;font-weight:600}
  .adminSection button:hover{background:#00ff9d;color:#000}
  .adminSection button.danger{border-color:#ff3b5c;color:#ff3b5c}
  .adminSection button.danger:hover{background:#ff3b5c;color:#000}
</style>
</head>
<body>

<div id="loginPage">
  <div class="login-box">
    <h1>DDOS-CONSOLE</h1>
    <p>by LeoXD</p>
    <div class="authTabs">
      <button id="tabLogin" class="active">LOGIN</button>
      <button id="tabReg">REGISTER</button>
    </div>
    <div class="err-msg" id="loginErr"></div>
    <div class="ok-msg" id="loginOk"></div>
    <input type="text" id="loginUser" placeholder="username" autocomplete="off"/>
    <input type="password" id="loginPass" placeholder="password" autocomplete="off"/>
    <button id="loginBtn" class="primary">LOGIN</button>
    <button id="regBtn" class="primary" style="display:none">REGISTER</button>
    <div class="divider">— atau —</div>
    <button id="githubBtn" class="github">🐙 LOGIN WITH GITHUB</button>
  </div>
</div>

<nav id="mainNav" style="display:none">
  <span class="brand">DDOS-CONSOLE</span>
  <span class="tab active" data-p="ddos">DDOS</span>
  <span class="tab leo" data-p="leo">✦ LEO AI</span>
  <span class="tab admin" id="adminTab" data-p="admin" style="display:none">⚙ ADMIN</span>
  <span class="status" id="navStatus">idle</span>
  <span class="userTag" id="navUser"></span>
  <span class="logout" id="logoutBtn">LOGOUT</span>
</nav>

<div class="page active" id="page-ddos" style="display:none">
  <aside>
    <label>TARGET</label>
    <input id="target" placeholder="https://target.com"/>
    <label>METHOD</label>
    <select id="method">
      <option value="http">HTTP FLOOD</option>
      <option value="slowloris">SLOWLORIS</option>
      <option value="udp">UDP FLOOD</option>
      <option value="syn">SYN FLOOD</option>
      <option value="tls">TLS HELLO</option>
      <option value="http2">HTTP/2 RESET</option>
      <option value="mixed">MIXED</option>
    </select>
    <label>THREADS</label>
    <input id="threads" type="number" value="1024"/>
    <label>DURATION (s)</label>
    <input id="duration" type="number" value="60"/>
    <div class="btns">
      <button id="startBtn">START</button>
      <button id="stopBtn" class="danger">STOP</button>
    </div>
    <div class="btns"><button id="scanBtn">VULN SCAN</button></div>
  </aside>
  <div class="main">
    <div id="log"><div class="dim">[system] ready.</div></div>
    <div class="stats">
      <span>REQ: <b id="sReq">0</b></span>
      <span>ERR: <b id="sErr">0</b></span>
      <span>RPS: <b id="sRps">0</b></span>
      <span>STATUS: <b id="sSt">idle</b></span>
    </div>
  </div>
</div>

<div class="page" id="page-leo" style="display:none">
  <div id="leoHead">
    <div class="av">L</div>
    <div>
      <div class="title">LeoAI</div>
      <div class="sub">by LeoXD · security research assistant</div>
    </div>
  </div>
  <div id="leoLog"></div>
  <div id="leoInput">
    <div id="fileChip"><span id="fileName"></span><span class="x" id="fileClear">✕</span></div>
    <div class="inputRow">
      <button id="attachBtn">📎</button>
      <input type="file" id="fileInput" style="display:none"/>
      <textarea id="leoPrompt" placeholder="Ketik / untuk menu, atau tanya apa saja..." rows="1"></textarea>
      <button id="sendBtn">SEND</button>
    </div>
    <div id="menuHint">Ketik <b>/menu</b> untuk lihat fitur</div>
  </div>
</div>

<div class="page" id="page-admin" style="display:none">
  <h2>⚙ ADMIN PANEL</h2>

  <div class="adminSection">
    <h3>👥 KELOLA ADMIN</h3>
    <input id="newAdminUser" placeholder="username admin baru"/>
    <button id="addAdminBtn">TAMBAH ADMIN</button>
    <div id="adminsList" style="margin-top:12px;font-size:12px;color:#c9d4e0"></div>
  </div>
</div>

<script>
function $(id){ return document.getElementById(id); }

function isLoggedIn(){ return !!localStorage.getItem('leo_auth'); }
function saveAuth(user, avatar){
  localStorage.setItem('leo_auth', 'ok');
  localStorage.setItem('leo_user', user || 'user');
  if(avatar) localStorage.setItem('leo_avatar', avatar);
}
function clearAuth(){
  localStorage.removeItem('leo_auth');
  localStorage.removeItem('leo_user');
  localStorage.removeItem('leo_avatar');
}
function getCurrentUser(){ return localStorage.getItem('leo_user') || ''; }

function showApp(){
  $('loginPage').style.display = 'none';
  $('mainNav').style.display = 'flex';
  $('page-ddos').style.display = 'flex';
  $('navUser').textContent = '@' + (localStorage.getItem('leo_user') || 'user');
}
function showLogin(){
  $('loginPage').style.display = 'flex';
  $('mainNav').style.display = 'none';
  $('page-ddos').style.display = 'none';
  $('page-leo').style.display = 'none';
  $('page-admin').style.display = 'none';
}

(function(){
  var params = new URLSearchParams(location.search);
  var token = params.get('leo_token');
  var user = params.get('leo_user');
  var avatar = params.get('leo_avatar');
  var err = params.get('leo_err');
  if(token && user){ saveAuth(user, avatar); history.replaceState({}, '', location.pathname); }
  if(err){
    setTimeout(function(){
      var el = $('loginErr');
      if(el){ el.textContent = 'GitHub error: ' + err; el.style.display = 'block'; }
    }, 100);
    history.replaceState({}, '', location.pathname);
  }
})();

var authMode = 'login';
$('tabLogin').onclick = function(){
  authMode = 'login';
  this.classList.add('active');
  $('tabReg').classList.remove('active');
  $('loginBtn').style.display = 'block';
  $('regBtn').style.display = 'none';
  $('loginErr').style.display = 'none';
  $('loginOk').style.display = 'none';
};
$('tabReg').onclick = function(){
  authMode = 'register';
  this.classList.add('active');
  $('tabLogin').classList.remove('active');
  $('loginBtn').style.display = 'none';
  $('regBtn').style.display = 'block';
  $('loginErr').style.display = 'none';
  $('loginOk').style.display = 'none';
};
function showErr(msg){ $('loginErr').textContent = msg; $('loginErr').style.display = 'block'; $('loginOk').style.display = 'none'; }
function showOk(msg){ $('loginOk').textContent = msg; $('loginOk').style.display = 'block'; $('loginErr').style.display = 'none'; }

$('regBtn').onclick = function(){
  var u = $('loginUser').value.trim();
  var p = $('loginPass').value;
  if(!u || !p) return showErr('isi username dan password');
  if(u.length < 3) return showErr('username minimal 3 karakter');
  if(p.length < 4) return showErr('password minimal 4 karakter');
  fetch('/api/auth?action=register', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: u, password: p })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error) return showErr(d.error);
    showOk('Akun dibuat! Silakan login.');
    setTimeout(function(){ $('tabLogin').click(); }, 1200);
  })
  .catch(function(e){ showErr('error: ' + e.message); });
};

$('loginBtn').onclick = function(){
  var u = $('loginUser').value.trim();
  var p = $('loginPass').value;
  if(!u || !p) return showErr('isi username dan password');
  fetch('/api/auth?action=login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: u, password: p })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.error) return showErr(d.error);
    saveAuth(d.username);
    showApp();
    initApp();
    initAdminPanel();
  })
  .catch(function(e){ showErr('error: ' + e.message); });
};

$('githubBtn').onclick = function(){
  fetch('/api/auth?action=config')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.githubClientId) return showErr('GitHub Client ID belum di-set');
      var redirect = encodeURIComponent(location.origin + '/api/auth?action=github');
      location.href = 'https://github.com/login/oauth/authorize?client_id=' + d.githubClientId + '&redirect_uri=' + redirect + '&scope=read:user';
    })
    .catch(function(e){ showErr('error: ' + e.message); });
};

$('logoutBtn').onclick = function(){ clearAuth(); location.reload(); };

$('loginPass').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ authMode === 'register' ? $('regBtn').click() : $('loginBtn').click(); }
});

var appInited = false;

function initApp(){
  if(appInited) return;
  appInited = true;

  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].onclick = (function(t){
      return function(){
        document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
        document.querySelectorAll('.page').forEach(function(p){ p.style.display = 'none'; });
        t.classList.add('active');
        var pg = $('page-' + t.dataset.p);
        if(pg) pg.style.display = 'flex';
      };
    })(tabs[i]);
  }

  function log(msg, cls){
    cls = cls || '';
    var el = $('log');
    if(!el) return;
    var t = new Date().toLocaleTimeString();
    var d = document.createElement('div');
    if(cls) d.className = cls;
    d.textContent = '[' + t + '] ' + msg;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
  }

  var running = false;

  $('startBtn').onclick = function(){
    if(running) return log('sudah jalan', 'warn');
    var target = $('target').value.trim();
    if(!target) return log('target kosong', 'err');
    var method = $('method').value;
    var threads = +$('threads').value;
    var duration = +$('duration').value;
    running = true;
    $('navStatus').textContent = 'running';
    $('sSt').textContent = 'running';
    log('START ' + method + ' → ' + target, 'ok');
    fetch('/api/attack', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ target: target, method: method, threads: threads, duration: duration })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.error) return log('error: ' + d.error, 'err');
      log('spawned ' + d.workers + ' workers', 'info');
      poll();
    })
    .catch(function(e){ log('gagal: ' + e.message, 'err'); });
  };

  $('stopBtn').onclick = function(){
    running = false;
    $('navStatus').textContent = 'stopped';
    $('sSt').textContent = 'stopped';
    log('STOP', 'warn');
    fetch('/api/attack', { method: 'DELETE' }).catch(function(){});
  };

  $('scanBtn').onclick = function(){
    var target = $('target').value.trim();
    if(!target) return log('target kosong', 'err');
    log('scanning ' + target, 'info');
    fetch('/api/scan', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ target: target })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.error) return log('scan error: ' + d.error, 'err');
      (d.findings || []).forEach(function(f){
        log('[' + f.severity + '] ' + f.name + ' — ' + f.detail, f.severity==='high'?'err':f.severity==='medium'?'warn':'ok');
      });
      log('scan selesai: ' + d.count + ' temuan', 'ok');
    })
    .catch(function(e){ log('scan gagal: ' + e.message, 'err'); });
  };

  function poll(){
    if(!running) return;
    fetch('/api/attack')
      .then(function(r){ return r.json(); })
      .then(function(d){
        $('sReq').textContent = d.req;
        $('sErr').textContent = d.err;
        $('sRps').textContent = d.rps;
        if(!d.running){ running = false; $('sSt').textContent = 'stopped'; }
        if(d.logs) d.logs.forEach(function(l){ log(l.msg, l.cls); });
      })
      .catch(function(){});
    setTimeout(poll, 1000);
  }

  var chatHistory = [];
  var attached = null;

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderSmart(text){
    var h = escapeHtml(text);
    var fence = '```';
    var parts = h.split(fence);
    var out = '';
    var lastHeader = '';
    for(var i=0;i<parts.length;i++){
      if(i % 2 === 1){
        var code = parts[i].replace(/^\w*\n/, '');
        var id = 'code_' + Math.random().toString(36).slice(2,8);
        var headerHtml = lastHeader ? '<div class="fileHeader">📄 ' + lastHeader + '</div>' : '';
        out += headerHtml + '<pre id="' + id + '"><button class="copy-btn" data-target="' + id + '">COPY</button>' + code + '</pre>';
        lastHeader = '';
      } else {
        var chunk = parts[i];
        var m = chunk.match(/===\s*([^\n=]+?)\s*===/);
        if(m) lastHeader = m[1];
        out += chunk.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      }
    }
    return out;
  }

  function bindCopy(){
    document.querySelectorAll('.copy-btn').forEach(function(btn){
      if(btn.dataset.bound) return;
      btn.dataset.bound = '1';
      btn.onclick = function(){
        var pre = document.getElementById(btn.getAttribute('data-target'));
        if(!pre) return;
        var code = pre.textContent.replace('COPY','');
        navigator.clipboard.writeText(code).then(function(){
          btn.textContent = 'COPIED!';
          setTimeout(function(){ btn.textContent = 'COPY'; }, 1200);
        });
      };
    });
  }

  function addMsg(type, text){
    var el = document.createElement('div');
    el.className = 'msg ' + type;
    var who = type === 'u' ? 'YOU' : type === 'a' ? '◆ LEO AI' : '⚠ ERROR';
    if(type === 'a'){ el.innerHTML = '<span class="who">' + who + '</span>' + renderSmart(text); }
    else { el.innerHTML = '<span class="who">' + who + '</span>' + escapeHtml(text); }
    var lg = $('leoLog');
    lg.appendChild(el);
    lg.scrollTop = lg.scrollHeight;
    bindCopy();
    return el;
  }

  function handleMenu(cmd){
    if(cmd === '/menu') return '╔══════════════════════════════════╗\n║         LEO AI MENU              ║\n╠══════════════════════════════════╣\n║  /menu     → tampilkan menu      ║\n║  /ddos     → info fitur DDoS     ║\n║  /malware  → info fitur malware  ║\n║  /scan     → info vuln scanner   ║\n║  /recon    → info recon tools    ║\n║  /exploit  → info exploit dev    ║\n║  /rev      → reverse engineering ║\n║  /help     → bantuan umum        ║\n╚══════════════════════════════════╝\n\nKetik /<command> untuk detail.';
    if(cmd === '/ddos') return '[ LOAD TEST & DEFENSE ]\n\nLeoAI bisa bantu merancang uji beban terbatas pada localhost atau layanan milikmu, membaca metrik, dan memperkuat mitigasi. Sertakan batas laju, durasi, dan kondisi berhenti.';
    if(cmd === '/malware') return '[ MALWARE ANALYSIS ]\n\nLeoAI bisa bantu menganalisis perilaku sampel, membaca indikator kompromi, memahami hasil static/dynamic analysis, dan menyusun langkah deteksi serta containment.';
    if(cmd === '/scan') return '[ VULN SCANNER ]\n\n· SQL Injection\n· XSS Reflected\n· Directory Traversal\n· Open Directory\n· PHPInfo Exposure\n· Git Exposure\n· Env File Leak\n· Header Missing';
    if(cmd === '/recon') return '[ RECON ]\n\n· OSINT profiling\n· Subdomain enum\n· Port scanning\n· Tech fingerprinting';
    if(cmd === '/exploit') return '[ EXPLOIT DEV ]\n\n· CVE weaponization\n· Buffer overflow\n· RCE chain\n· Privilege escalation\n· AMSI/ETW bypass\n· 0-day reasoning';
    if(cmd === '/rev') return '[ REVERSE ENGINEERING ]\n\n· Binary analysis\n· Disassembly\n· Protocol reversing\n· Firmware dumping';
    if(cmd === '/help') return '[ HELP ]\n\n/menu untuk semua command.\n\nLangsung tanya:\n· "analisis indikator malware ini"\n· "bantu rancang load test localhost dengan batas aman"\n· "fix code ini" (upload)';
    return null;
  }

  var ta = $('leoPrompt');
  ta.addEventListener('input', function(){
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 140) + 'px';
  });
  ta.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  $('sendBtn').onclick = send;
  $('attachBtn').onclick = function(){ $('fileInput').click(); };
  $('fileInput').onchange = function(e){
    var f = e.target.files[0];
    if(!f) return;
    if(f.size > 200*1024){ alert('max 200KB'); return; }
    var r = new FileReader();
    r.onload = function(ev){
      attached = { name: f.name, size: f.size, content: ev.target.result };
      $('fileName').textContent = f.name;
      $('fileChip').classList.add('on');
    };
    r.readAsText(f);
  };
  $('fileClear').onclick = function(){
    attached = null;
    $('fileInput').value = '';
    $('fileChip').classList.remove('on');
  };


  async function send(){
    var p = ta.value.trim();
    if(!p && !attached) return;
    addMsg('u', p + (attached ? '\n📎 ' + attached.name : ''));
    var menuReply = handleMenu(p.toLowerCase());
    if(menuReply){ addMsg('a', menuReply); ta.value = ''; return; }
    var loading = addMsg('a', '◆ mikir...');
    var payload = { prompt: p, file: attached, history: chatHistory.slice(-8) };
    chatHistory.push({ role: 'user', content: p });
    ta.value = '';
    ta.style.height = 'auto';
    attached = null;
    $('fileChip').classList.remove('on');
    $('fileInput').value = '';

    try {
      var r = await fetch('/api/oracle', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      var raw = await r.text();
      var d;
      try { d = JSON.parse(raw); }
      catch(pe){
        loading.remove();
        addMsg('err', 'Response bukan JSON.\nStatus: ' + r.status + '\nRaw: ' + raw.slice(0, 300));
        return;
      }
      loading.remove();
      if(d.answer){
        var a = addMsg('a', d.answer);
        var m = document.createElement('div');
        m.style.fontSize = '10px'; m.style.color = '#5c6b7f'; m.style.marginTop = '6px';
        m.textContent = 'via ' + d.provider + ' · ' + d.model + ' · tier ' + (d.tier || 'free');
        a.appendChild(m);
        chatHistory.push({ role: 'assistant', content: d.answer.slice(0, 2000) });
        return;
      }
      var errText = '';
      if(d.stage === 'env'){ errText = '⚠ ' + d.error + '\n\nKenapa: ' + d.reason + '\nSolusi: ' + d.fix; }
      else if(d.stage === 'all_failed'){ errText = '⚠ ' + d.error + '\n' + d.summary; }
      else { errText = '⚠ ' + (d.error || 'unknown'); if(d.reason) errText += '\nKenapa: ' + d.reason; if(d.fix) errText += '\nSolusi: ' + d.fix; }
      addMsg('err', errText);
    } catch(e){
      loading.remove();
      addMsg('err', 'Network error: ' + e.message);
    }
  }

  addMsg('a', 'Yo. LeoAI siap. by LeoXD.\n\nKetik /menu untuk lihat fitur.\n\n💬 Chat gratis — langsung gas.');
}

/* ===== ADMIN PANEL ===== */
async function checkAdmin(){
  try {
    var r = await fetch('/api/admin', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'checkAdmin', user: getCurrentUser() })
    });
    var d = await r.json();
    return !!d.isAdmin;
  } catch(e){ return false; }
}

async function initAdminPanel(){
  var isAdmin = await checkAdmin();
  if(!isAdmin) return;
  $('adminTab').style.display = 'inline-block';

  $('addAdminBtn').onclick = async function(){
    var u = $('newAdminUser').value.trim();
    if(!u) return alert('username kosong');
    var r = await fetch('/api/admin', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'addAdmin', user: getCurrentUser(), newAdmin: u })
    });
    var d = await r.json();
    if(d.error) return alert(d.error);
    alert('Admin ditambahkan');
    $('newAdminUser').value = '';
    loadAdmins();
  };

  loadAdmins();
}

async function loadAdmins(){
  var r = await fetch('/api/admin', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'listAdmins', user: getCurrentUser() })
  });
  var d = await r.json();
  if(d.error) return;
  var html = '<b>Owner:</b> @' + d.owner + '<br><b>Admins:</b> ';
  html += (d.admins || []).map(function(a){ return '@' + a; }).join(', ') || '(kosong)';
  $('adminsList').innerHTML = html;
}

if(isLoggedIn()){
  showApp();
  initApp();
  initAdminPanel();
} else {
  showLogin();
}
